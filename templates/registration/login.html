{% extends 'base.html' %}
{% block title %}Entrar | Nova Mecânica{% endblock %}
{% block content %}
<div class="row justify-content-center py-4">
    <div class="col-md-7 col-lg-5">
        <div class="card shadow-sm"><div class="card-body p-4">
            <h1 class="h3">Entrar na oficina</h1>
            <p class="text-muted">Use seu usuário e senha para acessar o sistema.</p>
            <form method="post">
                {% csrf_token %}
                {% include 'includes/form_fields.html' %}
                <input type="hidden" name="next" value="{{ next }}">
                <button class="btn btn-warning w-100" type="submit">Entrar</button>
            </form>
        </div></div>
    </div>
</div>
{% endblock %}
